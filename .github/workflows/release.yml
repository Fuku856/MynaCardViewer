# GitHub でリリースを手動作成（公開）すると、Windows 用 exe をビルドしてリリースに添付する。
# dev ブランチを対象にしたリリースは、作成時に指定し忘れてもプレリリースにする。
name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: dev ブランチからのリリースはプレリリースにする
        if: github.event.release.target_commitish == 'dev' && !github.event.release.prerelease
        shell: bash
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 依存パッケージのインストール
        run: python -m pip install -r requirements.txt

      # OCR 用の Tesseract を conda-forge から取得（tools/tesseract-win-64.lock の SHA-256 で固定）
      - name: Tesseract の取得
        shell: pwsh
        run: ./tools/fetch_tesseract.ps1

      - name: テスト
        run: python -m unittest tests.test_card tests.test_authenticity

      - name: exe のビルド
        run: python -m PyInstaller --noconfirm --onefile --windowed --name MynaCardViewer --add-data "vendor\tesseract;tesseract" main.py

      - name: リリースに添付
        shell: bash
        run: |
          name="MynaCardViewer-${TAG}.exe"
          licenses="MynaCardViewer-${TAG}-licenses.zip"
          cp dist/MynaCardViewer.exe "$name"
          cp README.md THIRD_PARTY_NOTICES.md vendor/tesseract/licenses/
          (cd vendor/tesseract && 7z a -tzip "../../$licenses" licenses > /dev/null)
          sha256sum "$name" "$licenses" > "MynaCardViewer-${TAG}.sha256"
          gh release upload "$TAG" "$name" "$licenses" "MynaCardViewer-${TAG}.sha256" --repo "$GITHUB_REPOSITORY" --clobber
