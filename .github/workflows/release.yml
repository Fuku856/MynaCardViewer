# GitHub でリリースを手動作成（公開）すると、Windows 用 exe をビルドしてリリースに添付する。
# dev ブランチを対象にしたリリースは、作成時に指定し忘れてもプレリリースにする。
name: Release build

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: dev ブランチからのリリースはプレリリースにする
        if: github.event.release.target_commitish == 'dev' && !github.event.release.prerelease
        shell: bash
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip

      - name: 依存パッケージのインストール
        run: python -m pip install -r requirements.txt

      - name: テスト
        run: python -m unittest tests.test_card tests.test_authenticity

      - name: exe のビルド
        run: python -m PyInstaller --noconfirm --onefile --windowed --name MynaCardViewer main.py

      - name: リリースに添付
        shell: bash
        run: |
          name="MynaCardViewer-${TAG}.exe"
          cp dist/MynaCardViewer.exe "$name"
          sha256sum "$name" > "$name.sha256"
          gh release upload "$TAG" "$name" "$name.sha256" --repo "$GITHUB_REPOSITORY" --clobber
